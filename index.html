<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界辦桌 World Banquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

<style>

@font-face{font-family:"SweiSpringSugar";src:url("fonts/swei-ui.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"SweiSpringSugar Common";src:url("fonts/swei-common.woff2") format("woff2");font-weight:100 900;font-display:swap}

/* =========================================================
   0. 設計變數
   ========================================================= */
:root{
  --vh: 1vh;                       /* 由 JS 寫入 innerHeight * 0.01 */
  --c-bg:#FDEBDD;   --c-card:#FDF5EE;
  --c-gold:#E3A835; --c-gold-2:#EBC27A; --c-gold-3:#F5D9AE;
  --c-brown:#5A3E24; --c-brown-off:#96806A;
  --c-err:#D9534F;
  --header-h:56px;
  --app-w:min(100vw, 480px);
  --ring-speed:40s;                /* 環繞菜色轉一圈秒數 */
  --ring-offset-y:-1%;             /* 環繞圓心上下微調（負數＝往上） */
  /* 各區塊固定高度（以螢幕高度為準，一頁內放得下、不用滑動） */
  --step-head-h:calc(var(--vh) * 6);
  --title-h:calc(var(--vh) * 8);       /* STEP2 菜名 */
  --title-sm-h:calc(var(--vh) * 6);      /* STEP3、STEP4 菜名 */
  --detail-dish-h:calc(var(--vh) * 30);  /* STEP2 料理圖 */
  --info-h:calc(var(--vh) * 25);         /* STEP2 特色＋故事 */
  --plate-h:calc(var(--vh) * 17);        /* STEP3 盤子 */
  --ingr-h:calc(var(--vh) * 14);        /* STEP3 食材卡圖 */
  --orbit-h:calc(var(--vh) * 30);        /* STEP4 料理＋環繞食材 */
  --award-h:calc(var(--vh) * 50);        /* 結果頁分享卡 */
  --font:"SweiSpringSugar","SweiSpringSugar Common","Noto Serif TC","Songti TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#E9D6C3;font-family:var(--font);color:var(--c-brown);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}

/* =========================================================
   1. App 外框（手機高度用 --vh 修正）
   ========================================================= */
.app{
  position:relative;width:var(--app-w);
  height:100vh;                         /* fallback */
  height:calc(var(--vh) * 100);         /* JS 修正法 */
  margin:0 auto;background:var(--c-bg);overflow:hidden;
  display:flex;flex-direction:column;
}

/* 三種背景底圖，依頁面切換（淡入淡出） */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--c-bg) center top/cover no-repeat;opacity:0;transition:opacity .5s ease}
.bg.show{opacity:1}

/* =========================================================
   2. Header（黃色圓角矩形用程式畫）
   ========================================================= */
.header{
  position:relative;z-index:10;flex:none;
  height:calc(var(--header-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0;
  background:var(--c-gold);border-radius:0 0 22px 22px;
  display:flex;align-items:center;justify-content:space-between;
}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;transition:transform .15s,opacity .3s}
.icon-btn img{width:25px;height:25px;object-fit:contain}
.icon-btn:active{transform:scale(.88)}
.icon-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.logo{height:30px;display:flex;align-items:center;justify-content:center}
.logo img{height:100%;width:auto}

/* =========================================================
   3. 頁面切換
   ========================================================= */
.stage{position:relative;flex:1;min-height:0;z-index:1}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(16px);
  transition:opacity .45s ease,transform .45s ease,visibility 0s .45s;
}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease,visibility 0s}
.screen-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:30px 12px}
.screen-body.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.screen-foot{flex:none;display:flex;justify-content:center;padding:10px 0 calc(36px + env(safe-area-inset-bottom))}

/* =========================================================
   4. 共用元件
   ========================================================= */
/* 圖片還沒放進 assets/ 時，自動顯示檔名色塊 */
.ph{
  width:100%;height:100%;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;
  background:repeating-linear-gradient(45deg,#F3D3B0 0 10px,#F6DDC0 10px 20px);
  border:2px dashed #D9A86A;border-radius:14px;
  color:#9A6B3A;font:600 11px/1.3 ui-monospace,Menlo,monospace;padding:4px;word-break:break-all;
}
.ph.round{border-radius:50%}
.media{width:100%;height:100%;object-fit:contain}

/* 主按鈕（圖片） */
.btn{display:block;width:46%;transition:transform .15s,filter .3s,opacity .3s}
.btn img{width:100%;height:auto}
.btn .ph{height:58px;border-radius:999px}
.btn:active{transform:scale(.96)}
.btn[aria-disabled="true"].no-off-img img{filter:grayscale(.6) brightness(1.15);opacity:.75}
.btn.wide{width:64%}
.btn.shake{animation:shake .45s}

/* 步驟標題（圖片，固定高度） */
.step-head{display:flex;justify-content:center;height:var(--step-head-h);margin:0 auto calc(var(--vh) * 1.5)}
.step-head img{height:100%;width:auto;max-width:100%;object-fit:contain}
.step-head .ph{width:78%}

/* 菜名（圖片，固定高度） */
.dish-title{display:flex;justify-content:center;height:var(--title-h);margin:calc(var(--vh) * 1.2) 0}
.dish-title img{height:100%;width:auto;max-width:86%;object-fit:contain}
.dish-title .ph{width:70%}
.dish-title.sm{--title-h:var(--title-sm-h)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
@keyframes float{50%{translate:0 -8px}}
@keyframes blink{50%{opacity:0}}

/* =========================================================
   5. ① 首頁
   ========================================================= */
.home-title{width:70%}
.home-title img{width:100%;height:auto}
.home-title .ph{height:150px}
.home-table{width:min(94%, calc(var(--vh) * 50));aspect-ratio:1}

/* =========================================================
   6. ② 環繞菜色（以中心為圓心旋轉）
   ========================================================= */
.ring-wrap{position:relative;width:min(100%, calc(var(--vh) * 58));aspect-ratio:1;margin:0 auto}
.ring{position:absolute;inset:0;translate:0 var(--ring-offset-y);z-index:1;animation:spin var(--ring-speed) linear infinite}   /* 疊在 intro-center 前面 */
.ring-item{position:absolute;width:18%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.ring-item .inner{width:100%;height:100%}
/* 每張菜色沿著圓心放射排列：圖片「上方」朝外、「下方」朝圓心 */
.ring-center{position:absolute;inset:13%}
.ring-center img{width:100%;height:100%;object-fit:contain}
@media (prefers-reduced-motion:reduce){.ring,.ring .inner{animation:none!important}}

/* =========================================================
   7. ③ STEP1 選菜
   ========================================================= */
/* minmax(0,1fr)：兩欄永遠等寬，不會被長英文名撐開 */
.dish-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.dish-card{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.dish-card .thumb{width:100%;aspect-ratio:1;border-radius:20px;background:rgba(255,255,255,.5);padding:8%;transition:transform .15s}
.dish-card:active .thumb{transform:scale(.96)}
.dish-card.locked .thumb{padding:0;overflow:hidden;background:none}
.dish-card.locked .thumb img{object-fit:cover}
.name-tag{flex:1;display:flex;flex-direction:column;justify-content:center;width:94%;padding:6px 4px;border-radius:12px;background:var(--c-brown);color:#fff;text-align:center;
  box-shadow:inset 0 0 0 2px var(--c-brown),inset 0 0 0 3.5px #fff}
.name-tag b{display:block;font-size:15px;letter-spacing:.2em}
.name-tag small{display:block;font-size:10px;letter-spacing:.03em;line-height:1.25;text-wrap:balance}  /* 英文太長時自動換行 */
.dish-card.just-unlocked .thumb{animation:shake .5s .2s}
.line-banner{display:block;margin-top:18px;width:100%}
.line-banner img{width:100%;height:auto}
.line-banner .ph{height:90px}

/* =========================================================
   8. ④ STEP2 認識料理
   ========================================================= */
/* 料理圖上下有透明留白 → 圖放大 128%、上下各吃掉 14%，只留實際內容的高度 */
.detail-img{display:flex;justify-content:center;height:var(--detail-dish-h)}
.detail-img img{height:calc(var(--detail-dish-h) * 1.28);width:auto;max-width:none;margin:calc(var(--detail-dish-h) * -.14) 0}
.detail-img .ph{width:60%}
.info-img{display:flex;justify-content:center;height:var(--info-h)}
.info-img img{height:100%;width:auto;max-width:88%;object-fit:contain}
.info-img .ph{width:88%}

/* =========================================================
   9. ⑤ STEP3 選食材＋餐盤
   ========================================================= */
.plate-area{display:flex;flex-direction:column;align-items:center}
.plate{position:relative;height:var(--plate-h);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff 0 58%,#F1E8DD 60% 100%);
  box-shadow:0 6px 0 #C9A27E,0 12px 18px rgba(90,62,36,.15);transition:background .4s,box-shadow .4s}
.plate.done{background:transparent;box-shadow:none}   /* 料理完成後不顯示盤子 */
.plate-dish{position:absolute;inset:-8%;opacity:0;transform:scale(.5);transition:.55s cubic-bezier(.3,1.5,.5,1)}
.plate.done .plate-dish{opacity:1;transform:scale(1)}
.chip{position:absolute;width:36%;aspect-ratio:1;transform:translate(-50%,-50%);transition:opacity .35s,transform .35s;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.plate.done .chip{opacity:0;transform:translate(-50%,-50%) scale(.3)}

/* 食材框：卡片在框內左右滑動 */
.ingr-panel{position:relative;margin:0 -12px;padding:calc(var(--vh) * 1) 0 0;overflow:hidden}
.ingr-scroll{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:calc(var(--ingr-h) + 8px);
  gap:calc(var(--vh) * 1) 10px;overflow-x:auto;overflow-y:hidden;padding:2px 14px 4px;scroll-snap-type:x proximity;
  scroll-padding:0 14px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.ingr-scroll::-webkit-scrollbar{display:none}
.ingr-scroll.dragging{scroll-snap-type:none;cursor:grabbing}
.ingr-card{scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.ingr-card .thumb{width:100%;aspect-ratio:1;padding:10%;border-radius:16px;background:var(--c-card);border:4px solid transparent;transition:background .2s,border-color .2s}
.ingr-card.selected .thumb{border-color:var(--c-gold);background:var(--c-gold-3)}
.ingr-card.wrong .thumb{border-color:var(--c-err)}
.ingr-card.shake{animation:shake .45s}
.ingr-card b{display:block;font-size:13px;font-weight:700;letter-spacing:.05em;line-height:1.3;text-align:center}
.ingr-card small{display:block;font-size:9px;letter-spacing:.05em;line-height:1.2;text-align:center}
.fly{position:fixed;z-index:50;pointer-events:none;margin:0}

/* =========================================================
   10. ⑥ STEP4 大廚署名
   ========================================================= */
.orbit{position:relative;height:var(--orbit-h);aspect-ratio:1.2;max-width:100%;margin:0 auto}
.orbit .center-dish{position:absolute;left:50%;top:50%;width:48%;aspect-ratio:1;transform:translate(-50%,-50%)}
.orbit .float{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);animation:float 3s ease-in-out infinite}
.name-card{padding:calc(var(--vh) * 1.8) 14px calc(var(--vh) * 2);border-radius:120px 120px 28px 28px/60px 60px 28px 28px;background:#fff;text-align:center}
.name-tip{display:flex;justify-content:center;height:calc(var(--vh) * 8);margin:0 auto}
.name-tip img{height:100%;width:auto;max-width:100%;object-fit:contain}
.name-tip .ph{width:82%}
.slots{position:relative;display:flex;justify-content:center;gap:8px;margin-top:calc(var(--vh) * 1)}
.slot{width:40px;height:calc(var(--vh) * 5.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;
  border-bottom:2px solid var(--c-brown);font-size:28px;font-weight:900;position:relative}
.slot.cursor::after{content:"";position:absolute;bottom:8px;left:50%;width:2px;height:28px;background:var(--c-brown);animation:blink 1s step-end infinite}
.name-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:none;color:transparent;caret-color:transparent}

/* =========================================================
   11. ⑦ 結果頁
   ========================================================= */
.result-head{text-align:center}
.result-head .t1{font-size:24px;font-weight:900;letter-spacing:.1em}
.result-head .t2{font-size:32px;font-weight:900;letter-spacing:.2em;margin:2px 0 4px}
.result-head .t3{font-size:13px;font-weight:700;letter-spacing:.3em}
.award{height:var(--award-h);aspect-ratio:9/16;max-width:100%;margin:calc(var(--vh) * 1.5) auto 0;border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(90,62,36,.22)}
.award img{width:100%;height:100%;object-fit:cover}
.save-tip{text-align:center;font-size:12px;margin-top:8px;opacity:.75}

/* =========================================================
   12. 彈窗 / Toast
   ========================================================= */
.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(60,40,20,.55);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.modal.open{opacity:1;visibility:visible;transition:opacity .3s}
.modal-box{position:relative;width:100%;max-width:340px;padding:28px 20px 22px;border-radius:24px;background:var(--c-bg);text-align:center;
  transform:scale(.9);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.modal.open .modal-box{transform:none}
.modal-close{position:absolute;right:8px;top:8px;width:36px;height:36px;font-size:24px;line-height:1}
.modal h3{margin:12px 0 6px;font-size:21px;font-weight:900;letter-spacing:.1em}
.modal p{margin:0 0 18px;font-size:14px;font-weight:700;line-height:1.7}
.modal .text-btn{display:inline-block;min-width:80%;padding:10px 20px;border-radius:999px;background:var(--c-brown);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:.2em;text-decoration:none;box-shadow:inset 0 0 0 3px var(--c-brown),inset 0 0 0 5px #fff}
.dev-link{display:block;margin:14px auto 0;font-size:12px;text-decoration:underline;opacity:.6}
.modal-img{width:110px;height:110px;margin:0 auto}

/* 鎖頭動畫 */
.lock{position:relative;width:64px;height:84px;margin:0 auto}
.lock .shackle{position:absolute;left:12px;top:0;width:40px;height:46px;border:8px solid var(--c-gold);border-bottom:0;border-radius:22px 22px 0 0;
  transform-origin:100% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1) .35s}
.lock .body{position:absolute;left:0;bottom:0;width:64px;height:48px;border-radius:10px;background:var(--c-gold)}
.lock .body::after{content:"";position:absolute;left:50%;top:14px;width:10px;height:18px;margin-left:-5px;border-radius:5px;background:var(--c-brown)}
.modal.open .lock .shackle{transform:translateY(-12px) rotate(28deg)}

/* 菜卡翻面 */
.flip-row{display:flex;justify-content:center;gap:14px;margin:16px 0 4px}
.flip{width:110px;aspect-ratio:1;perspective:700px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s ease .9s}
.modal.open .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;overflow:hidden;background:var(--c-card);padding:8%}
.flip-face.back{transform:rotateY(180deg)}
.flip-face.front{padding:0}
.flip-face.front img{object-fit:cover}

/* 儲存圖片 overlay */
.save-box{max-width:360px}
.save-box img{max-height:calc(var(--vh) * 62);width:auto;margin:0 auto 12px;border-radius:12px}

.toast{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));z-index:60;max-width:88%;
  padding:10px 18px;border-radius:999px;background:rgba(90,62,36,.94);color:#fff;font-size:14px;font-weight:700;text-align:center;
  opacity:0;transform:translate(-50%,16px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- 三種背景底圖 -->
  <div class="bg" data-bg="bgHome"></div>
  <div class="bg" data-bg="bgChoose"></div>
  <div class="bg" data-bg="bgStep"></div>

  <!-- Header：左＝回首頁、中＝logo、右＝上一頁 -->
  <header class="header">
    <button class="icon-btn" id="btnHome" aria-label="回首頁" data-asset="btnHome"></button>
    <div class="logo" data-asset="logo" data-alt="世界辦桌"></div>
    <button class="icon-btn" id="btnBack" aria-label="上一頁" data-asset="btnReturn"></button>
  </header>

  <main class="stage">

    <!-- ① 首頁 -->
    <section class="screen active" id="s-home">
      <div class="screen-body center">
        <div class="home-title" data-asset="homeTitle" data-alt="世界辦桌 World Banquet"></div>
        <div class="home-table" data-asset="homeTable"></div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnStart" data-alt="開始辦桌" data-go="intro"></button>
      </div>
    </section>

    <!-- ② 環繞菜色 -->
    <section class="screen" id="s-intro">
      <div class="screen-body center">
        <div class="ring-wrap">
          <div class="ring" id="ring"></div>
          <div class="ring-center" data-asset="introCenter" data-alt="選擇一道你喜歡的豬肉料理"></div>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnChoose" data-alt="開始選菜" data-go="choose"></button>
      </div>
    </section>

    <!-- ③ STEP1 選擇料理 -->
    <section class="screen" id="s-choose">
      <div class="screen-body">
        <div class="step-head" data-asset="head1" data-alt="STEP1 選擇料理"></div>
        <div class="dish-grid" id="dishGrid"></div>
        <button class="line-banner" id="lineBanner" data-asset="lineBanner" data-alt="加入良作LINE會員 立即解鎖2道限定料理"></button>
      </div>
    </section>

    <!-- ④ STEP2 認識料理 -->
    <section class="screen" id="s-detail">
      <div class="screen-body">
        <div class="step-head" data-asset="head2" data-alt="STEP2 認識料理"></div>
        <div class="detail-img" id="detailImg"></div>
        <div class="dish-title" id="detailTitle"></div>
        <div class="info-img" id="detailInfo"></div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnToIngr" data-alt="挑選食材" data-go="ingr"></button>
      </div>
    </section>

    <!-- ⑤ STEP3 選擇食材 -->
    <section class="screen" id="s-ingr">
      <div class="screen-body">
        <div class="step-head" data-asset="head3" data-alt="STEP3 選擇食材"></div>
        <div class="plate-area">
          <div class="plate" id="plate"><div class="plate-dish" id="plateDish"></div></div>
          <div class="dish-title sm" id="ingrTitle"></div>
        </div>
        <div class="ingr-panel">
          <div class="ingr-scroll" id="ingrGrid"></div>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" id="btnFinish" data-asset="btnFinish" data-alt="挑選完成" aria-disabled="true"></button>
      </div>
    </section>

    <!-- ⑥ STEP4 大廚署名 -->
    <section class="screen" id="s-sign">
      <div class="screen-body">
        <div class="step-head" data-asset="head4" data-alt="STEP4 完成上菜"></div>
        <div class="orbit" id="orbit"></div>
        <div class="dish-title sm" id="signTitle"></div>
        <div class="name-card">
          <div class="name-tip" data-asset="chefTip" data-alt="請輸入大廚暱稱（限6字）"></div>
          <label class="slots" id="slots">
            <input class="name-input" id="nameInput" type="text" autocomplete="off" enterkeyhint="done" aria-label="大廚暱稱">
          </label>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" id="btnServe" data-asset="btnServe" data-alt="送出上菜" aria-disabled="true"></button>
      </div>
    </section>

    <!-- ⑦ 結果 / 分享卡 -->
    <section class="screen" id="s-result">
      <div class="screen-body">
        <div class="result-head">
          <div class="t1">恭喜完成這道</div>
          <div class="t2" id="resultDish"></div>
          <div class="t3">想不想把這份好味道帶回家？</div>
        </div>
        <div class="award" id="awardPreview"></div>
        <div class="save-tip">也可以直接長按上方圖片儲存</div>
      </div>
      <div class="screen-foot">
        <button class="btn wide" id="btnDownload" data-asset="btnDownload" data-alt="下載我的主廚成就"></button>
      </div>
    </section>
  </main>

  <!-- 彈窗：加入 LINE 解鎖 -->
  <div class="modal" id="modalLine">
    <div class="modal-box">
      <button class="modal-close" data-close>×</button>
      <div class="modal-img" data-asset="lockImg"></div>
      <h3>神秘隱藏版料理</h3>
      <p>加入良作 LINE 會員<br>即可解鎖 2 道限定隱藏料理！</p>
      <a class="text-btn" id="btnJoinLine" href="#" target="_blank" rel="noopener">加入會員</a>
      <button class="dev-link" id="devUnlock">（開發測試）模擬解鎖成功</button>
    </div>
  </div>

  <!-- 彈窗：解鎖成功 -->
  <div class="modal" id="modalUnlocked">
    <div class="modal-box">
      <div class="lock"><div class="shackle"></div><div class="body"></div></div>
      <h3>隱藏菜單已解鎖！</h3>
      <div class="flip-row" id="flipRow"></div>
      <p></p>
      <button class="text-btn" data-close>去看看</button>
    </div>
  </div>

  <!-- 彈窗：長按儲存（LINE / IG 內建瀏覽器用） -->
  <div class="modal" id="modalSave">
    <div class="modal-box save-box">
      <button class="modal-close" data-close>×</button>
      <img id="saveImg" alt="我的主廚成就">
      <p style="margin:0">長按圖片即可儲存到相簿</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script>
/* =========================================================
   A. 圖片素材（全部放在 assets/ 資料夾）
      圖片還沒放進去時，畫面會顯示檔名色塊，放進去就自動出現
   ========================================================= */
const DIR = 'assets/';
const ASSETS = {
  // 全站
  logo:'logo.png',
  btnHome:'btn-home.png', btnReturn:'btn-return.png',
  bgHome:'bg-home.png',       // 背景 1：首頁
  bgChoose:'bg-choose.png',   // 背景 2：環繞菜色、STEP1 選菜
  bgStep:'bg-step.png',       // 背景 3：STEP2 ～ 結果頁
  // ① 首頁
  homeTitle:'title-home.png', homeTable:'ill-home-table.png', btnStart:'btn-start.png',
  // ② 環繞菜色
  introCenter:'intro-center.png', btnChoose:'btn-choose.png',
  // ③ STEP1
  head1:'title-step-1.png', lineBanner:'banner-line-unlock.png', vipCard:'card-vip-cover.png', lockImg:'icon-lock-vip.png',
  // ④ STEP2
  head2:'title-step-2.png', btnToIngr:'btn-to-ingr.png',
  // ⑤ STEP3
  head3:'title-step-3.png', btnFinish:'btn-finish.png', btnFinishOff:'btn-finish-disabled.png',
  // ⑥ STEP4
  head4:'title-step-4.png', chefTip:'tip-chef-input.png', btnServe:'btn-serve.png', btnServeOff:'btn-serve-disabled.png',
  // ⑦ 結果
  btnDownload:'btn-download.png',
  shareCardBg:'share-card-bg.png',   // 1080×1920，含框、logo、Award、底部色塊
  shareLogo:'share-logo.png',        // 沒有 share-card-bg 時才會用到
};
for (const k in ASSETS) ASSETS[k] = DIR + ASSETS[k];

/* 每頁用哪張背景 */
const SCREEN_BG = { home:'bgHome', intro:'bgChoose', choose:'bgChoose', detail:'bgStep', ingr:'bgStep', sign:'bgStep', result:'bgStep' };
/* 右上「上一頁」的去處 */
const BACK = { intro:'home', choose:'intro', detail:'choose', ingr:'detail', sign:'ingr', result:'sign' };

const LINE_URL = '#'; // 之後放良作 LINE 加好友連結

/* =========================================================
   B. 料理資料 —— 來自 data.js（改 data.js 就好，不用改這裡）
   ========================================================= */
function buildDishes(data){
  if (!data) throw new Error('找不到 data.js，或 data.js 有語法錯誤（按 F12 看主控台第一個紅字）');
  const ING = data.ingredients || {}, problems = [];
  const pick = (ids, ok, dish) => (ids || []).map(id => {
    const g = ING[id];
    if (!g){ problems.push(`「${dish}」用到不存在的食材代號：${id}`); return null; }
    return { id, n: g.zh, e: g.en, ok, img: DIR + 'Ingredients/' + (g.img || `ingr-${id}.png`) };
  }).filter(Boolean);

  const dishes = (data.dishes || []).map(d => {
    const ingredients = [...pick(d.correct, true, d.name), ...pick(d.wrong, false, d.name)];
    if (!d.correct?.length) problems.push(`「${d.name}」沒有正確食材，會無法過關`);
    const both = (d.correct || []).filter(id => (d.wrong || []).includes(id));
    if (both.length) problems.push(`「${d.name}」的 ${both.join('、')} 同時在 correct 和 wrong`);
    return {
      id: d.id, name: d.name, en: d.en || '', secret: !!d.secret,
      feature: d.feature || '', story: d.story || '',
      img:      DIR + 'food/'  + (d.img      || `dish-${d.id}.png`),                  // 料理插圖
      nameImg:  DIR +            (d.nameImg  || `title-${d.id}.png`),                 // 料理名稱字圖
      infoImg:  DIR + 'info/'  + (d.infoImg  || `info-${d.id}.png`),                  // STEP2 特色＋故事字圖
      awardImg: DIR + 'Award/' + (d.awardImg || `world-banquet-Award-${d.id}.png`),   // 結果頁分享卡底圖（只差暱稱）
      ingredients,
    };
  });
  if (problems.length){ console.warn('data.js 需要檢查：\n' + problems.join('\n')); setTimeout(() => toast(`料理資料有 ${problems.length} 個問題，請按 F12 看主控台`), 300); }
  console.table(dishes.map(d => ({ 料理: d.name, 食材數: d.ingredients.length, 正確: d.ingredients.filter(x => x.ok).length })));
  return dishes;
}
let DISHES = [];

/* =========================================================
   C. 狀態
   ========================================================= */
const state = { screen:'home', dish:null, order:[], picked:new Set(), chef:'', unlocked:false, cardBlob:null, cardUrl:'' };

/* =========================================================
   D. 工具
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const media = (src, alt = '', round = false) =>
  `<img class="media${round ? ' round' : ''}" src="${src}" alt="${esc(alt)}" draggable="false">`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const restartAnim = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

/* 圖片載入失敗（還沒放進 assets/）→ 換成檔名色塊 */
document.addEventListener('error', e => {
  const im = e.target;
  if (im.tagName !== 'IMG' || im.onerror || !im.getAttribute('src') || im.src.startsWith('blob:')) return;
  const ph = document.createElement('div');
  ph.className = 'ph' + (im.classList.contains('round') ? ' round' : '');
  ph.textContent = im.getAttribute('src').split('/').pop();
  im.replaceWith(ph);
}, true);

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* 按鈕可用 / 停用：有停用圖就換圖，沒有就自動變灰 */
function setBtnEnabled(btn, on, offKey){
  btn.setAttribute('aria-disabled', on ? 'false' : 'true');
  const img = btn.querySelector('img');
  if (!img) return;
  if (offKey && !btn.dataset.noOff){
    const want = on ? ASSETS[btn.dataset.asset] : ASSETS[offKey];
    if (img.getAttribute('src') !== want){
      img.onerror = () => {               // 停用圖還沒做 → 改用原圖變灰
        img.onerror = null; btn.dataset.noOff = '1';
        btn.classList.add('no-off-img'); img.src = ASSETS[btn.dataset.asset];
      };
      img.src = want;
    }
  } else {
    btn.classList.add('no-off-img');
  }
}

/* 把 ASSETS 填進有 data-asset 的元素 */
function applyAssets(){
  document.querySelectorAll('[data-asset]').forEach(el => {
    el.innerHTML = `<img src="${ASSETS[el.dataset.asset]}" alt="${esc(el.dataset.alt || '')}" draggable="false">`;
  });
  document.querySelectorAll('[data-bg]').forEach(el => {
    el.style.backgroundImage = `url("${ASSETS[el.dataset.bg]}")`;
  });
}
function showBg(id){
  const key = SCREEN_BG[id];
  document.querySelectorAll('[data-bg]').forEach(el => el.classList.toggle('show', el.dataset.bg === key));
}

/* =========================================================
   E. 100vh 修正（--vh）
   ========================================================= */
function setVh(){
  // 輸入暱稱時鍵盤彈出會縮小 innerHeight，這時不更新，避免版面被壓扁
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
}
setVh();
window.addEventListener('resize', setVh);
window.addEventListener('orientationchange', () => setTimeout(setVh, 300));

/* =========================================================
   F. 頁面切換
   ========================================================= */
const onEnter = {
  choose: renderChoose,
  detail: renderDetail,
  ingr:   renderIngr,
  sign:   renderSign,
  result: renderResult,
};
function go(id, { back = false } = {}){
  const cur = $(`#s-${state.screen}`), next = $(`#s-${id}`);
  if (!next || cur === next) return;
  if (!back) onEnter[id]?.();               // 返回上一頁時保留原本的選擇
  cur.classList.remove('active');
  next.classList.add('active');
  if (!back) next.querySelector('.screen-body').scrollTop = 0;
  state.screen = id;
  showBg(id);
  const atHome = id === 'home';
  $('#btnHome').setAttribute('aria-disabled', atHome);
  $('#btnBack').setAttribute('aria-disabled', atHome);
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { if (b.getAttribute('aria-disabled') !== 'true') go(b.dataset.go); }));

function resetAll(){
  Object.assign(state, { dish:null, picked:new Set(), chef:'', cardBlob:null });
  if (state.cardUrl) URL.revokeObjectURL(state.cardUrl);
  state.cardUrl = '';
  $('#nameInput').value = '';
  go('home');
}
$('#btnHome').addEventListener('click', resetAll);
$('#btnBack').addEventListener('click', () => { nameInput.blur(); if (BACK[state.screen]) go(BACK[state.screen], { back:true }); });

/* =========================================================
   G. ② 環繞菜色（以中心為圓心旋轉）
   ========================================================= */
function buildRing(){
  const ring = $('#ring'), n = DISHES.length, R = 41; // R = 半徑（容器 %）
  ring.innerHTML = DISHES.map((d, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const rot = (i / n) * 360;            // 正上方 0°，順時針遞增 → 放射狀
    return `<div class="ring-item" style="left:${50 + R * Math.cos(a)}%;top:${50 + R * Math.sin(a)}%;--rot:${rot}deg">
      <div class="inner">${media(d.img, d.name, true)}</div></div>`;
  }).join('');
}

/* =========================================================
   H. ③ STEP1 選菜 + 隱藏菜單
   ========================================================= */
function renderChoose(){
  $('#dishGrid').innerHTML = DISHES.map(d => {
    const locked = d.secret && !state.unlocked;
    return `<button class="dish-card${locked ? ' locked' : ''}" data-id="${d.id}">
      <div class="thumb">${locked ? media(ASSETS.vipCard, '神秘隱藏版') : media(d.img, d.name)}</div>
      <div class="name-tag">${locked ? '<b>神秘隱藏版</b><small>Mystery Menu</small>' : `<b>${d.name}</b><small>${d.en}</small>`}</div>
    </button>`;
  }).join('');
  $('#lineBanner').hidden = state.unlocked;
}
$('#dishGrid').addEventListener('click', e => {
  const card = e.target.closest('.dish-card'); if (!card) return;
  const d = DISHES.find(x => x.id === card.dataset.id);
  if (d.secret && !state.unlocked) return openModal('modalLine');
  state.dish = d;
  go('detail');
});
$('#lineBanner').addEventListener('click', () => openModal('modalLine'));
$('#btnJoinLine').href = LINE_URL;

/* 解鎖成功（之後串會員時，在驗證成功後呼叫 unlockSecret() 即可） */
function unlockSecret(){
  state.unlocked = true;
  closeModal('modalLine');
  $('#flipRow').innerHTML = DISHES.filter(d => d.secret).map(d => `
    <div class="flip"><div class="flip-inner">
      <div class="flip-face front">${media(ASSETS.vipCard, 'VIP')}</div>
      <div class="flip-face back">${media(d.img, d.name)}</div>
    </div></div>`).join('');
  setTimeout(() => openModal('modalUnlocked'), 250);
  renderChoose();
}
$('#devUnlock').addEventListener('click', unlockSecret);

/* =========================================================
   I. ④ STEP2 認識料理
   ========================================================= */
const titleHTML = d => `<img src="${d.nameImg}" alt="${esc(d.name + ' ' + d.en)}" draggable="false">`;
function renderDetail(){
  const d = state.dish;
  $('#detailImg').innerHTML = media(d.img, d.name);
  $('#detailTitle').innerHTML = titleHTML(d);
  $('#detailInfo').innerHTML = `<img src="${d.infoImg}" alt="${esc(`料理特色：${d.feature} 料理故事：${d.story}`)}" draggable="false">`;
}

/* =========================================================
   J. ⑤ STEP3 選食材 + 餐盤動畫
   ========================================================= */
const correctList = () => state.dish.ingredients.filter(x => x.ok);
function slotPos(k, n){
  if (n === 1) return { x:50, y:50 };
  const a = (k / n) * Math.PI * 2 - Math.PI / 2, r = 30;
  return { x: 50 + r * Math.cos(a), y: 50 + r * Math.sin(a) };
}
function renderIngr(){
  const d = state.dish;
  state.picked = new Set();
  state.order = shuffle(d.ingredients);
  $('#ingrTitle').innerHTML = titleHTML(d);
  $('#plateDish').innerHTML = media(d.img, d.name, true);
  $('#plate').classList.remove('done');
  $('#plate').querySelectorAll('.chip').forEach(c => c.remove());
  $('#ingrGrid').innerHTML = state.order.map((g, i) => `
    <button class="ingr-card" data-i="${i}">
      <div class="thumb">${media(g.img, g.n)}</div>
      <div><b>${g.n}</b><small>${g.e}</small></div>
    </button>`).join('');
  // 預設捲到所有食材卡的正中間
  const grid = $('#ingrGrid');
  requestAnimationFrame(() => grid.scrollLeft = (grid.scrollWidth - grid.clientWidth) / 2);
  updatePick();
}
function updatePick(){
  const need = correctList().length, got = state.picked.size, done = got === need;
  setBtnEnabled($('#btnFinish'), done, 'btnFinishOff');
  $('#plate').classList.toggle('done', done);
  return done;
}
function flyTo(srcEl, plate, pos){
  const r = srcEl.getBoundingClientRect(), p = plate.getBoundingClientRect();
  const size = p.width * 0.36;
  const tx = p.left + p.width * pos.x / 100, ty = p.top + p.height * pos.y / 100;
  const clone = srcEl.cloneNode(true);
  clone.classList.add('fly');
  Object.assign(clone.style, { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px' });
  document.body.appendChild(clone);
  const dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height / 2), s = size / r.width;
  const anim = clone.animate(
    [{ transform:'translate(0,0) scale(1)' }, { transform:`translate(${dx}px,${dy - 40}px) scale(${s * 1.1})`, offset:.7 }, { transform:`translate(${dx}px,${dy}px) scale(${s})` }],
    { duration:600, easing:'cubic-bezier(.5,0,.3,1)' });
  return anim.finished.catch(() => {}).then(() => clone.remove());
}
/* 食材框：電腦上可用滑鼠拖曳或滾輪左右捲動 */
(() => {
  const el = $('#ingrGrid');
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });
  let down = null, moved = false;
  el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = { x:e.clientX, left:el.scrollLeft }; moved = false; });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.x;
    if (Math.abs(dx) > 5){ moved = true; el.classList.add('dragging'); }
    if (moved) el.scrollLeft = down.left - dx;
  });
  window.addEventListener('pointerup', () => { down = null; el.classList.remove('dragging'); });
  el.addEventListener('click', e => { if (moved){ e.stopImmediatePropagation(); moved = false; } }, true);
})();

$('#ingrGrid').addEventListener('click', e => {
  const card = e.target.closest('.ingr-card'); if (!card) return;
  const i = +card.dataset.i, g = state.order[i], plate = $('#plate');

  // 再點一次 = 取消
  if (state.picked.has(i)){
    state.picked.delete(i);
    card.classList.remove('selected');
    plate.querySelector(`.chip[data-i="${i}"]`)?.remove();
    updatePick();
    return;
  }
  // 選錯 → 搖動 + 提示
  if (!g.ok){
    restartAnim(card, 'shake');
    card.classList.add('wrong');
    setTimeout(() => card.classList.remove('wrong'), 600);
    navigator.vibrate?.(80);
    toast(`「${g.n}」不是${state.dish.name}的食材喔，再想想！`);
    return;
  }
  // 選對 → 飛進餐盤
  state.picked.add(i);
  card.classList.add('selected');
  const list = correctList(), k = list.indexOf(g), pos = slotPos(k, list.length);
  flyTo(card.querySelector('.thumb > *'), plate, pos).then(() => {
    if (!state.picked.has(i)) return;           // 飛行中被取消
    const chip = document.createElement('div');
    chip.className = 'chip'; chip.dataset.i = i;
    chip.style.left = pos.x + '%'; chip.style.top = pos.y + '%';
    chip.innerHTML = media(g.img, g.n, true);
    plate.appendChild(chip);
    if (updatePick()) toast('食材到齊，料理完成！');
  });
});
$('#btnFinish').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (btn.getAttribute('aria-disabled') === 'true'){
    restartAnim(btn, 'shake');
    toast(`還差 ${correctList().length - state.picked.size} 樣食材喔`);
    return;
  }
  go('sign');
});

/* =========================================================
   K. ⑥ STEP4 大廚暱稱（6 字內，支援注音輸入法）
   ========================================================= */
const MAX = 6;
const nameInput = $('#nameInput'), slotsEl = $('#slots');
let composing = false;

function renderSign(){
  const d = state.dish, list = correctList(), n = list.length;
  const floats = list.map((g, k) => {
    const a = (k / n) * Math.PI * 2 - Math.PI / 2;
    const x = 50 + 30 * Math.cos(a), y = 50 + 36 * Math.sin(a);   // 離中心的距離（%）
    return `<div class="float" style="left:${x}%;top:${y}%;animation-delay:${-k * .5}s">${media(g.img, g.n, true)}</div>`;
  }).join('');
  $('#orbit').innerHTML = `<div class="center-dish">${media(d.img, d.name)}</div>${floats}`;
  $('#signTitle').innerHTML = titleHTML(d);
  if (!slotsEl.querySelector('.slot')){
    slotsEl.insertAdjacentHTML('afterbegin', Array.from({ length:MAX }, () => '<span class="slot"></span>').join(''));
  }
  nameInput.value = state.chef;
  renderSlots(state.chef);
  setBtnEnabled($('#btnServe'), !!state.chef, 'btnServeOff');
}
function renderSlots(v){
  const chars = Array.from(v), focused = document.activeElement === nameInput;
  slotsEl.querySelectorAll('.slot').forEach((s, i) => {
    s.textContent = chars[i] || '';
    s.classList.toggle('cursor', focused && i === Math.min(chars.length, MAX - 1) && chars.length < MAX);
  });
}
function syncName(){
  let chars = Array.from(nameInput.value.replace(/\s/g, ''));
  if (chars.length > MAX){ chars = chars.slice(0, MAX); toast('最多 6 個字喔'); }
  nameInput.value = state.chef = chars.join('');
  renderSlots(state.chef);
  setBtnEnabled($('#btnServe'), !!state.chef, 'btnServeOff');
}
nameInput.addEventListener('compositionstart', () => composing = true);
nameInput.addEventListener('compositionend', () => { composing = false; syncName(); });
nameInput.addEventListener('input', () => composing ? renderSlots(nameInput.value) : syncName());
nameInput.addEventListener('focus', () => renderSlots(nameInput.value));
nameInput.addEventListener('blur', () => { renderSlots(nameInput.value); setTimeout(setVh, 300); });
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !composing) nameInput.blur(); });

$('#btnServe').addEventListener('click', e => {
  if (!state.chef){ restartAnim(e.currentTarget, 'shake'); toast('請先輸入大廚暱稱'); nameInput.focus(); return; }
  nameInput.blur();
  go('result');
});

/* =========================================================
   L. ⑦ 分享卡（Canvas 產生 1080×1920 PNG）
   ========================================================= */
const FONT = '"SweiSpringSugar", "SweiSpringSugar Common", "Noto Serif TC", serif';
const loadImg = src => new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => res(im); im.onerror = rej; im.src = src;
});
const tryImg = src => loadImg(src).catch(() => null);
function rr(ctx, X, Y, W, H, R){
  ctx.beginPath();
  ctx.moveTo(X + R, Y); ctx.arcTo(X + W, Y, X + W, Y + H, R); ctx.arcTo(X + W, Y + H, X, Y + H, R);
  ctx.arcTo(X, Y + H, X, Y, R); ctx.arcTo(X, Y, X + W, Y, R); ctx.closePath();
}
function drawContain(ctx, im, X, Y, W, H){
  const s = Math.min(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
  ctx.drawImage(im, X + (W - w) / 2, Y + (H - h) / 2, w, h);
}
function fitText(ctx, text, weight, size, maxW){
  do { ctx.font = `${weight} ${size}px ${FONT}`; size -= 4; } while (ctx.measureText(text).width > maxW && size > 20);
}
function spaced(ctx, px){ if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }

async function drawFallbackBg(x, W, H, BR){
  x.fillStyle = '#FDEBDD'; x.fillRect(0, 0, W, H);
  x.save(); rr(x, 62, 62, 956, 1796, 34); x.clip();
  x.fillStyle = '#EDC888';
  x.beginPath(); x.moveTo(40, 1480);
  x.bezierCurveTo(220, 1460, 180, 1690, 380, 1700); x.bezierCurveTo(580, 1710, 600, 1560, 780, 1580);
  x.bezierCurveTo(950, 1600, 920, 1430, 1040, 1420); x.lineTo(1040, 1900); x.lineTo(40, 1900); x.fill();
  x.fillStyle = '#E6B35A';
  x.beginPath(); x.moveTo(500, 1900);
  x.bezierCurveTo(560, 1780, 760, 1800, 860, 1720); x.bezierCurveTo(960, 1640, 980, 1560, 1040, 1540); x.lineTo(1040, 1900); x.fill();
  x.restore();
  x.strokeStyle = '#D4A35A';
  x.lineWidth = 8; rr(x, 40, 40, 1000, 1840, 48); x.stroke();
  x.lineWidth = 3; rr(x, 62, 62, 956, 1796, 34); x.stroke();
  x.textAlign = 'center'; x.fillStyle = BR;
  const logo = await tryImg(ASSETS.shareLogo);
  if (logo) drawContain(x, logo, 220, 150, 640, 180);
  else { x.font = `900 120px ${FONT}`; spaced(x, 16); x.fillText('世界辦桌', W / 2, 300); spaced(x, 0); }
  x.font = 'italic 120px Georgia, "Times New Roman", serif'; x.fillText('Award', W / 2, 520);
  x.lineWidth = 3; x.strokeStyle = BR;
  x.beginPath(); x.moveTo(170, 540); x.lineTo(370, 540); x.moveTo(710, 540); x.lineTo(910, 540); x.stroke();
}

async function generateCard(){
  const d = state.dish, W = 1081, H = 1921, BR = '#5A3E24';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  // 先確保卡片上會出現的字（含暱稱）都已載入，canvas 才畫得出正確字型
  const text = `世界辦桌恭賀演繹經典風味榮獲最佳主廚${state.chef}${d.name}${d.en}`;
  try { await Promise.all(['900', '700'].map(w => document.fonts.load(`${w} 80px ${FONT}`, text))); } catch {}

  // 有 assets/Award/ 的成品圖 → 只在名字框裡寫上暱稱
  const award = await tryImg(d.awardImg);
  if (award){
    x.drawImage(award, 0, 0, W, H);
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = BR;
    fitText(x, state.chef, 900, 72, 540); spaced(x, 6);
    x.fillText(state.chef, 543, 1150);   // 名字框中心（原圖 1081×1921）
    return c;
  }

  const [bg, dishImg] = await Promise.all([tryImg(ASSETS.shareCardBg), tryImg(d.img)]);
  if (bg) x.drawImage(bg, 0, 0, W, H);
  else await drawFallbackBg(x, W, H, BR);

  if (dishImg) drawContain(x, dishImg, 170, 580, 740, 520);

  x.textAlign = 'center'; x.fillStyle = BR;
  x.font = `700 54px ${FONT}`; x.fillText('恭賀', W / 2, 1180);
  x.fillStyle = 'rgba(255,250,245,.92)'; rr(x, 230, 1215, 620, 120, 32); x.fill();
  x.fillStyle = BR; fitText(x, state.chef, 900, 76, 560); x.fillText(state.chef, W / 2, 1302);
  x.font = `700 56px ${FONT}`; spaced(x, 4); x.fillText('演繹經典風味榮獲', W / 2, 1440);
  fitText(x, d.name, 900, 128, 760); spaced(x, 8); x.fillText(d.name, W / 2, 1600);
  spaced(x, 6); fitText(x, d.en, 700, 44, 820); x.fillText(d.en, W / 2, 1670);
  spaced(x, 6); x.font = `900 76px ${FONT}`; x.fillText('最佳主廚', W / 2, 1790);
  spaced(x, 0);
  return c;
}

async function renderResult(){
  const d = state.dish;
  $('#resultDish').textContent = d.name;
  $('#awardPreview').innerHTML = '<div class="ph">分享卡產生中…</div>';
  state.cardBlob = null;
  try {
    const canvas = await generateCard();
    state.cardBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (state.cardUrl) URL.revokeObjectURL(state.cardUrl);
    state.cardUrl = URL.createObjectURL(state.cardBlob);
    $('#awardPreview').innerHTML = `<img src="${state.cardUrl}" alt="我的主廚成就">`;
  } catch (err) {
    console.error(err);
    $('#awardPreview').innerHTML = '<div class="ph">分享卡產生失敗：請用本機伺服器或正式網址開啟，不要直接雙擊 html 檔</div>';
  }
}

async function saveCard(){
  if (!state.cardBlob){ toast('分享卡還在準備中，請稍候'); return; }
  const ua = navigator.userAgent;
  const inApp  = /Line\/|FBAN|FBAV|Instagram/i.test(ua);   // LINE / FB / IG 內建瀏覽器不支援下載
  const mobile = /iPhone|iPad|iPod|Android/i.test(ua);
  const file = new File([state.cardBlob], `world-banquet-${state.dish.id}.png`, { type:'image/png' });

  if (inApp) return showSave();
  if (mobile && navigator.canShare?.({ files:[file] })){
    try { await navigator.share({ files:[file], title:'世界辦桌｜我的主廚成就' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (mobile) return showSave();
  const a = document.createElement('a');
  a.href = state.cardUrl; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
function showSave(){ $('#saveImg').src = state.cardUrl; openModal('modalSave'); }
$('#btnDownload').addEventListener('click', saveCard);

/* =========================================================
   M. 彈窗
   ========================================================= */
function openModal(id){ $('#' + id).classList.add('open'); }
function closeModal(id){ $('#' + id).classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
  if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('open');
}));
$('#modalUnlocked').addEventListener('transitionend', e => {
  // 關閉解鎖視窗後，讓新解鎖的兩張菜卡晃一下
  if (e.target.id !== 'modalUnlocked' || e.target.classList.contains('open')) return;
  document.querySelectorAll('.dish-card').forEach(c => {
    const d = DISHES.find(x => x.id === c.dataset.id);
    if (d.secret) { restartAnim(c, 'just-unlocked'); c.scrollIntoView({ behavior:'smooth', block:'center' }); }
  });
});

/* =========================================================
   N. 啟動
   ========================================================= */
applyAssets();
showBg('home');
try {
  DISHES = buildDishes(window.GAME_DATA);
  buildRing();
} catch (err) {
  console.error(err);
  toast(err.message); clearTimeout(toastTimer);             // 錯誤訊息留在畫面上
  document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-disabled', 'true'));
}
$('#btnHome').setAttribute('aria-disabled', true);
$('#btnBack').setAttribute('aria-disabled', true);
</script>
