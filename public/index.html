<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界辦桌 World Banquet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="app" id="app">

  <!-- 三種背景底圖 -->
  <div class="bg" data-bg="bgHome"></div>
  <div class="bg" data-bg="bgChoose"></div>
  <div class="bg" data-bg="bgStep"></div>

  <!-- Header：左＝回首頁、中＝logo、右＝上一頁 -->
  <header class="header">
    <button class="icon-btn" id="btnHome" aria-label="回首頁" data-asset="btnHome"></button>
    <div class="logo" data-asset="logo" data-alt="世界辦桌"></div>
    <button class="icon-btn" id="btnBack" aria-label="上一頁" data-asset="btnReturn"></button>
  </header>

  <main class="stage">

    <!-- ① 首頁 -->
    <section class="screen active" id="s-home">
      <div class="screen-body center">
        <div class="home-title" data-asset="homeTitle" data-alt="世界辦桌 World Banquet"></div>
        <div class="home-table" data-asset="homeTable"></div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnStart" data-alt="開始辦桌" data-go="intro"></button>
      </div>
    </section>

    <!-- ② 環繞菜色 -->
    <section class="screen" id="s-intro">
      <div class="screen-body center">
        <div class="ring-wrap">
          <div class="ring" id="ring"></div>
          <div class="ring-center" data-asset="introCenter" data-alt="選擇一道你喜歡的豬肉料理"></div>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnChoose" data-alt="開始選菜" data-go="choose"></button>
      </div>
    </section>

    <!-- ③ STEP1 選擇料理 -->
    <section class="screen" id="s-choose">
      <div class="screen-body">
        <div class="step-head" data-asset="head1" data-alt="STEP1 選擇料理"></div>
        <div class="dish-grid" id="dishGrid"></div>
        <button class="line-banner" id="lineBanner" data-asset="lineBanner" data-alt="加入良作LINE會員 立即解鎖2道限定料理"></button>
      </div>
    </section>

    <!-- ④ STEP2 認識料理 -->
    <section class="screen" id="s-detail">
      <div class="screen-body">
        <div class="step-head" data-asset="head2" data-alt="STEP2 認識料理"></div>
        <div class="detail-img" id="detailImg"></div>
        <div class="dish-title" id="detailTitle"></div>
        <div class="info-img" id="detailInfo"></div>
      </div>
      <div class="screen-foot">
        <button class="btn" data-asset="btnToIngr" data-alt="挑選食材" data-go="ingr"></button>
      </div>
    </section>

    <!-- ⑤ STEP3 選擇食材 -->
    <section class="screen" id="s-ingr">
      <div class="screen-body">
        <div class="step-head" data-asset="head3" data-alt="STEP3 選擇食材"></div>
        <div class="plate-area">
          <div class="plate" id="plate"><div class="plate-dish" id="plateDish"></div></div>
          <div class="dish-title sm" id="ingrTitle"></div>
        </div>
        <div class="ingr-panel">
          <div class="ingr-scroll" id="ingrGrid"></div>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" id="btnFinish" data-asset="btnFinish" data-alt="挑選完成" aria-disabled="true"></button>
      </div>
    </section>

    <!-- ⑥ STEP4 大廚署名 -->
    <section class="screen" id="s-sign">
      <div class="screen-body">
        <div class="step-head" data-asset="head4" data-alt="STEP4 完成上菜"></div>
        <div class="orbit" id="orbit"></div>
        <div class="dish-title sm" id="signTitle"></div>
        <div class="name-card">
          <div class="name-tip" data-asset="chefTip" data-alt="請輸入大廚暱稱（限6字）"></div>
          <label class="slots" id="slots">
            <input class="name-input" id="nameInput" type="text" autocomplete="off" enterkeyhint="done" aria-label="大廚暱稱">
          </label>
        </div>
      </div>
      <div class="screen-foot">
        <button class="btn" id="btnServe" data-asset="btnServe" data-alt="送出上菜" aria-disabled="true"></button>
      </div>
    </section>

    <!-- 烹煮頁（圖片之後再加） -->
    <section class="screen" id="s-cook">
      <div class="screen-body">
        <div class="cook-text">慢火滷煮中…</div>
        <div class="cook-bar"><div class="cook-fill" id="cookFill"></div></div>
      </div>
    </section>

    <!-- 上菜等待頁（傳送到現場螢幕） -->
    <section class="screen" id="s-wait">
      <div class="screen-body center">
        <div class="wait-card">
          <div class="lds-ripple" id="waitLoading"><div></div><div></div></div>
          <svg class="checkmark" id="waitCheck" viewBox="0 0 52 52" hidden><circle cx="26" cy="26" r="24"/><path d="M14 27 l7 7 l17 -17"/></svg>
          <div class="wait-title">請留意現場螢幕</div>
          <p class="wait-text" id="waitText"></p>
        </div>
      </div>
      <div class="screen-foot">
        <button id="btnWaitNext">查看我的主廚成就</button>
      </div>
    </section>

    <!-- ⑦ 結果 / 分享卡 -->
    <section class="screen" id="s-result">
      <div class="screen-body">
        <div class="result-head">
          <div class="t1">恭喜完成這道</div>
          <div class="t2" id="resultDish"></div>
          <div class="t3">想不想把這份好味道帶回家？</div>
        </div>
        <div class="award" id="awardPreview"></div>
        <div class="save-tip">也可以直接長按上方圖片儲存</div>
      </div>
      <div class="screen-foot">
        <button class="btn wide" id="btnDownload" data-asset="btnDownload" data-alt="下載我的主廚成就"></button>
      </div>
    </section>
  </main>

  <!-- 彈窗：加入 LINE 解鎖 -->
  <div class="modal" id="modalLine">
    <div class="modal-box">
      <button class="modal-close" data-close>×</button>
      <div class="modal-img" data-asset="lockImg"></div>
      <h3>神秘隱藏版料理</h3>
      <p>加入良作 LINE 會員<br>即可解鎖 2 道限定隱藏料理！</p>
      <a class="text-btn" id="btnJoinLine" href="#" target="_blank" rel="noopener">加入會員</a>
      <button class="dev-link" id="devUnlock">（開發測試）模擬解鎖成功</button>
    </div>
  </div>

  <!-- 彈窗：解鎖成功 -->
  <div class="modal" id="modalUnlocked">
    <div class="modal-box">
      <div class="lock"><div class="shackle"></div><div class="body"></div></div>
      <h3>隱藏菜單已解鎖！</h3>
      <div class="flip-row" id="flipRow"></div>
      <p></p>
      <button class="text-btn" data-close>去看看</button>
    </div>
  </div>

  <!-- 彈窗：長按儲存（LINE / IG 內建瀏覽器用） -->
  <div class="modal" id="modalSave">
    <div class="modal-box save-box">
      <button class="modal-close" data-close>×</button>
      <img id="saveImg" alt="我的主廚成就">
      <p style="margin:0">長按圖片即可儲存到相簿</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
